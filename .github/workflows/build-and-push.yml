# Diagnóstico 2026-08-06: comentário trivial pra testar se o push volta a disparar o run.
name: Build and push streamlit image

on:
  push:
    branches:
      - main
    paths:
      - "streamlit/**"
      - "pipeline/**"
      - "dbt/**"
      - ".github/workflows/build-and-push.yml"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: streamlit
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}:latest

      - name: Instala kustomize
        run: |
          # Mesmo mecanismo validado na spec 068 (jeysel.dev): download do
          # tarball de release fixo (v5.8.1) com retry, em vez do script
          # dinâmico install_kustomize.sh -- dois runs reais do jeysel.dev
          # falharam com stream truncado/gzip inválido por flakiness de rede
          # transitória do runner ubuntu-latest, não rate limit de API.
          curl -fSL --retry 5 --retry-delay 2 --retry-connrefused \
            -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz"
          tar xzf kustomize.tar.gz
          rm kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Atualiza tag da imagem no overlay de staging
        run: |
          cd deploy/k8s/overlays/staging
          kustomize edit set image \
            ghcr.io/${{ github.repository }}=ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha_short }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git diff --cached --quiet && exit 0
          # [skip ci]: evita loop — este commit também casa com o gatilho push:main
          git commit -m "deploy(staging): atualiza imagem para ${{ steps.vars.outputs.sha_short }} [skip ci]"
          git push

  build-and-push-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pipeline/Dockerfile
          push: true
          tags: |
            ghcr.io/jeysel-dev/weather-pipeline:${{ steps.vars.outputs.sha_short }}
            ghcr.io/jeysel-dev/weather-pipeline:latest
