apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml

# Promoção manual (spec 090) — bump deliberado desta tag + commit, ou
# kubectl patch application weather-analytics-api-production -n argocd.
images:
  - name: ghcr.io/jeysel-dev/weather-analytics/api
    # Promovido manualmente em 2026-10-06 — 7e8db10 (spec 025, addendum 2).
    # O fix anterior (80942cf) não resolveu em iPhone/Safari real — usuário
    # confirmou com cache purgado (Cloudflare + aba anônima) que o submenu
    # "Relatórios" continuava sem abrir, só que agora o drawer não fecha
    # mais (a parte do addendum 1 funcionou). Não foi possível reproduzir
    # em Chromium/WebKit via Playwright mesmo com o build exato de
    # produção — causa raiz exata no WebKit/iOS real não confirmada.
    # Versão anterior em produção: 80942cf.
    # Entrega deste bump: só web/src/nav.ts + web/src/style.css — troca o
    #   mecanismo de abertura do submenu de seletor CSS por atributo
    #   (`[aria-expanded=true] + .site-nav__sub`) para classe `.open`
    #   setada via JS (`sub.classList.toggle("open")`), o mesmo padrão já
    #   comprovado em produção para o drawer mobile
    #   (`.site-nav__links.open`). Nenhuma mudança de API/BigQuery/schema.
    # Validado: CI verde (run 37506535215 — pytest + build + smoke /health),
    #   staging sincronizado e Healthy em 7e8db10. Comportamento real em
    #   touch (iPhone) ainda PRECISA ser reconfirmado pelo usuário após
    #   este bump — ver spec 025, addendum 2, próximo passo se persistir
    #   (debug remoto via Safari Web Inspector).
    #
    # Rollback: última versão boa em produção é 80942cf.
    # `kustomize edit set image
    # ghcr.io/jeysel-dev/weather-analytics/api=...:80942cf` + commit + sync.
    newTag: 7e8db10
