apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml

# Promoção manual (spec 090) — bump deliberado desta tag + commit, ou
# kubectl patch application weather-analytics-api-production -n argocd.
images:
  - name: ghcr.io/jeysel-dev/weather-analytics/api
    # Promovido manualmente em 2026-09-03 — e895852 (specs 021/022/023, todas
    # aditivas, sem mudança de seed / migração de dado / mudança em mart_*).
    # Versão anterior em produção: 81fe368. Entrega deste bump:
    #   - spec 021: padrão de tabela responsiva .data-table + renderTable;
    #     refatora as 4 tabelas existentes (alertas, cidades, comparativo,
    #     relatorio-cidade). Só front, sem mudança de endpoint.
    #   - spec 022: 4 relatórios novos no submenu "Relatórios" —
    #     /relatorio-mensal, /relatorio-macrorregiao, /relatorio-extremos,
    #     /relatorio-chuva-acumulada (cada um com router +
    #     /api/v1/relatorio-*/dados).
    #   - spec 023: 5º relatório /relatorio-horario
    #     (/api/v1/relatorio-horario/dados, lê mart_climate__hourly_facts).
    # Validado em staging contra BigQuery real: 5 páginas 200 + data-table,
    # submenu "Relatórios" com 6 itens, os 5 endpoints /api/v1/relatorio-*
    # respondem 200 com payload coerente (MAX_BY/MIN_BY(STRUCT(...)) e
    # FORMAT_TIMESTAMP(..., 'America/Sao_Paulo') conferidos ao vivo).
    # CI verde: run 33787610758 (pytest + smoke test /health).
    #
    # Rollback: última versão boa em produção é 81fe368. `kustomize edit set
    # image ghcr.io/jeysel-dev/weather-analytics/api=...:81fe368` + commit +
    # sync.
    newTag: e895852
