apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml

# Promoção manual (spec 090) — bump deliberado desta tag + commit, ou
# kubectl patch application weather-analytics-api-production -n argocd.
images:
  - name: ghcr.io/jeysel-dev/weather-analytics/api
    # Promovido manualmente em 2026-09-03 — 4d95143 (adendo spec 019).
    # Versão anterior em produção: fa5fa49.
    # Entrega deste bump: footer linka o LICENSE (MIT, novo na raiz) via
    #   "Código e dados sob licença aberta" e perde os links placeholder
    #   Privacidade / Termos de Uso. Só layout.html + web/src/style.css.
    #   Não muda seed / mart_* / cache de referência → não precisa reiniciar
    #   pods além do rollout do bump.
    # Validado: CI verde (run 33808831043 — pytest 27 passed + smoke
    #   /health), staging sincronizado com 4d95143 e footer conferido no ar.
    #
    # Rollback: última versão boa em produção é fa5fa49. `kustomize edit set
    # image ghcr.io/jeysel-dev/weather-analytics/api=...:fa5fa49` + commit +
    # sync.
    newTag: 4d95143
