apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml

# Promoção manual (spec 090) — bump deliberado desta tag + commit, ou
# kubectl patch application weather-analytics-api-production -n argocd.
images:
  - name: ghcr.io/jeysel-dev/weather-analytics/api
    # Promovido manualmente em 2026-09-03 — 9a7ca2e (feat(api): Relatório
    # por Cidade — linhas diárias + subtotal por cidade + total geral,
    # spec 013). Mesma classe de correção do bump anterior: produção estava
    # pinada em a9065da, 3 commits ANTES de 9a7ca2e (a9065da..9a7ca2e =
    # 004d716, 3133691, 9a7ca2e). O redesenho está em main e validado em
    # staging desde então (o overlay de staging aponta pra 9a7ca2e, bump do
    # CI no commit 41fa306), mas a promoção pra produção ficou pendente —
    # o dashboard servia o relatório agregado antigo (1 linha/cidade, sem
    # coluna Data). Diagnóstico completo em
    # docs/specs/016-diagnostico-relatorio-cidade-producao/spec.md.
    # Tag anterior: a9065da (corte do Streamlit, spec 015; ver histórico do
    # git para os detalhes de validação daquela promoção).
    newTag: 9a7ca2e
