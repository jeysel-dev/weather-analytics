apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml

# Promoção manual (spec 090) — bump deliberado desta tag + commit, ou
# kubectl patch application weather-analytics-api-production -n argocd.
images:
  - name: ghcr.io/jeysel-dev/weather-analytics/api
    # Promovido manualmente em 2026-09-03 — a9065da (feat!: corte do
    # Streamlit, dashboard 100% FastAPI, spec 015). Corrige regressão real
    # encontrada na validação do teardown do Streamlit: produção estava
    # pinada em 2620c14, uma versão ANTES de a9065da — que é o commit que
    # introduziu os 7 redirects 308 das URLs legacy em maiúscula
    # (/Temperatura -> /temperatura etc.). Com o catch-all do Streamlit
    # removido nesta mesma rodada de corte, esses redirects passaram a ser
    # a única forma de as URLs legacy funcionarem; sem eles, 404 em vez de
    # 308. a9065da validado em staging por ~16h, todos os probes verdes:
    # 8/8 rotas HTTP 200, 7/7 redirects 308, /_stcore/health 404 (Streamlit
    # de fato fora). Tag anterior: 2620c14 (navbar sem emoji + footer
    # compartilhado; ver histórico do git para os detalhes de validação).
    newTag: a9065da
