apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml

# Promoção manual (spec 090) — bump deliberado desta tag + commit, ou
# kubectl patch application weather-analytics-api-production -n argocd.
images:
  - name: ghcr.io/jeysel-dev/weather-analytics/api
    # Promovido manualmente em 2026-09-03 — fa5fa49 (spec 024, adendo 1).
    # Versão anterior em produção: 07ace8f.
    # Entrega deste bump: filtro "Cidade" no /relatorio-chuva-acumulada
    #   (combobox pesquisável via /api/v1/ref/cidades, deep link ?cidade=…,
    #   endpoint aceita cidade opcional combinado com meso via AND).
    # Toca API (novo query param `cidade` em GET
    #   /api/v1/relatorio-chuva-acumulada/dados, helper cidade_filter() em
    #   routers/ref.py), template e frontend. Não muda seed / mart_* / cache
    #   de referência → não precisa reiniciar pods além do rollout do bump.
    # Validado: CI verde (run 33795712454 — pytest + smoke /health), staging
    #   sincronizado com fa5fa49.
    #
    # Rollback: última versão boa em produção é 07ace8f. `kustomize edit set
    # image ghcr.io/jeysel-dev/weather-analytics/api=...:07ace8f` + commit +
    # sync.
    newTag: fa5fa49
