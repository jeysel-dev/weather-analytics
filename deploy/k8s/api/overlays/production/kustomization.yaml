apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml

# Promoção manual (spec 090) — bump deliberado desta tag + commit, ou
# kubectl patch application weather-analytics-api-production -n argocd.
images:
  - name: ghcr.io/jeysel-dev/weather-analytics/api
    # Promovido manualmente em 2026-10-06 — 77fefcb (spec 025, correções de
    # experiência mobile). Versão anterior em produção: 70636b3.
    # Entrega deste bump: só CSS/templates (web/src/style.css +
    #   api/app/templates/{temperatura,precipitacao,alertas,comparativo}.html)
    #   — altura dos gráficos de barra com altura dinâmica não é mais
    #   esmagada em telas ≤720px; os 3 heatmaps densos ficam ocultos no
    #   mobile com nota explicativa; botão hambúrguer 44×44px; filtros com
    #   breakpoint em 480px. Nenhuma mudança de API/BigQuery/schema.
    # Validado: CI verde (run 37495141640 — pytest + build + smoke /health),
    #   staging sincronizado e Healthy em 77fefcb.
    #
    # Rollback: última versão boa em produção é 70636b3.
    # `kustomize edit set image
    # ghcr.io/jeysel-dev/weather-analytics/api=...:70636b3` + commit + sync.
    newTag: 77fefcb
