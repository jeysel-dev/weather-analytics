apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-analytics-api
  labels:
    app: weather-analytics-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-analytics-api
  template:
    metadata:
      labels:
        app: weather-analytics-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: weather-analytics-api
          image: ghcr.io/jeysel-dev/weather-analytics/api:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TMPDIR
              value: /tmp
          envFrom:
            # BIGQUERY_DATASET / BIGQUERY_SEEDS_DATASET / BIGQUERY_LOCATION —
            # compartilhados com a stack Streamlit, mesmos valores.
            - configMapRef:
                name: weather-analytics-config
            # GCP_PROJECT_ID (aplicado só via infra, repo privado).
            - configMapRef:
                name: weather-analytics-project-config
            # GOOGLE_APPLICATION_CREDENTIALS_API (spec 090).
            - configMapRef:
                name: weather-analytics-api-config
          volumeMounts:
            - name: gcp-api-key
              mountPath: /app/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: gcp-api-key
          secret:
            secretName: weather-analytics-sa-key
        - name: tmp
          emptyDir: {}
