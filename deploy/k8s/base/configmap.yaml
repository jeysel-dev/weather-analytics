apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-analytics-config
data:
  # GCP_PROJECT_ID NÃO fica neste ConfigMap (repo público) — vive em
  # weather-analytics-project-config, aplicado só via infra (repo privado),
  # ver deployment.yaml (segundo envFrom) e sync-configmap-weather-analytics-project-k8s.sh.
  # Valores abaixo já confirmados como os defaults em uso (.env.prod.example
  # e utils/bigquery.py do repo weather-analytics) — não secretos.
  BIGQUERY_DATASET: "marts"
  BIGQUERY_SEEDS_DATASET: "seeds"
  BIGQUERY_LOCATION: "southamerica-east1"
  # Caminho do arquivo montado via Secret (R3/R5) — mesmo nome de arquivo já
  # usado no docker-compose.prod.yml atual, só muda o mecanismo de entrega.
  GOOGLE_APPLICATION_CREDENTIALS_DASHBOARD: "/app/secrets/weather-dashboard-sa-key.json"
