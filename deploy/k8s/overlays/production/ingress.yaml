apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-analytics-production
  namespace: production
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: weather-analytics-production.internal
      http:
        paths:
          # --- FastAPI (spec 090). Uma linha nova por página migrada. ---
          - path: /horario
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /static/api
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /temperatura
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /precipitacao
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /alertas
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /cidades
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /comparativo
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /relatorio-cidade
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          # --- Streamlit (catch-all: tudo que não bate numa rota FastAPI acima,
          #     inclui as páginas antigas em maiúscula /Temperatura etc.). O "/"
          #     exato tem regra própria no Ingress -home abaixo, com prioridade
          #     forçada — sem ela o Traefik ranqueia por tamanho de regra e
          #     PathPrefix(`/`) ganharia de Path(`/`). ---
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weather-analytics
                port:
                  number: 8501
---
# Home nova (FastAPI) no "/" exato (spec 090). Ingress separado só por causa da
# anotação de prioridade: o Traefik aplica `router.priority` por Ingress e ela
# precisa valer só para esta regra Path(`/`) — junto do catch-all no mesmo
# Ingress ela subiria os dois routers e o PathPrefix(`/`), mais longo,
# continuaria ganhando. 100000 garante que Path(`/`) vença o catch-all; como
# Path(`/`) casa só com o path exato "/", não captura /temperatura nem
# /Temperatura — só a raiz.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-analytics-home-production
  namespace: production
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.priority: "100000"
spec:
  ingressClassName: traefik
  rules:
    - host: weather-analytics-production.internal
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
