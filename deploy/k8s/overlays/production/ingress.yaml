apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-analytics-production
  namespace: production
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: weather-analytics-production.internal
      http:
        paths:
          # --- FastAPI (spec 090). Uma linha nova por página migrada. ---
          - path: /horario
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /static/api
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          # --- Streamlit (catch-all, inalterado) ---
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weather-analytics
                port:
                  number: 8501
