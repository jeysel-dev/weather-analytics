apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-analytics-production
  namespace: production
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: weather-analytics-production.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weather-analytics
                port:
                  number: 8501
