apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-analytics
spec:
  template:
    spec:
      containers:
        - name: weather-analytics
          env:
            # Corrige spec 072/Fase 7 (incidente 2026-08-14): sem isso,
            # check_origin() do Streamlit rejeita o handshake WebSocket real
            # do navegador (Origin: https://weather.jeysel.dev) porque só
            # compara contra o Host reescrito pelo nginx para o roteamento
            # do Traefik (weather-analytics-production.internal). Só em
            # production — staging nunca recebe Origin público real.
            - name: STREAMLIT_BROWSER_SERVER_ADDRESS
              value: weather.jeysel.dev
