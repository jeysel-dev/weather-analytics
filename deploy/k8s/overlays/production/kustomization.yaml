apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml

patches:
  - path: patch-browser-address.yaml
    target:
      kind: Deployment
      name: weather-analytics

images:
  - name: ghcr.io/jeysel-dev/weather-analytics
    newName: ghcr.io/jeysel-dev/weather-analytics
    # Promovido manualmente em 2026-09-02 — cf5b614 (filtros movidos pro
    # corpo da página, date_input de período com min_date()/max_date(),
    # query com dois literais DATE via BETWEEN) validada em staging via
    # Playwright headless: min_date() rodou sem erro, BETWEEN com os dois
    # literais retornou dado real, calendário do date_input desabilita
    # "Previous month" exatamente no limite de min_date() (testado
    # navegando o calendário até travar), link de compartilhamento gera
    # inicio=/fim= e pré-preenche corretamente em contexto de navegador
    # limpo (sem sessão prévia). Synced em staging no momento da promoção
    # (confirmado ao vivo via kubectl antes deste commit, não presumido).
    # Promoção deliberada, sem bump automático de CI (production não tem
    # esse passo, por design).
    newTag: cf5b614
