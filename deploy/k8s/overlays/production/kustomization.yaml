apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  # ingress.yaml entra na Fase 6 (spec 072), mesmo padrão do staging —
  # promoção manual de tag já validada em staging, sem CI apontando pra cá
  # (mesmo padrão do overlay de production do jeysel.dev).

images:
  - name: ghcr.io/jeysel-dev/weather-analytics
    newName: ghcr.io/jeysel-dev/weather-analytics
    # Sem promoção ainda — placeholder até a Fase 6 (spec 072) promover
    # manualmente uma tag já validada em staging.
    newTag: latest
