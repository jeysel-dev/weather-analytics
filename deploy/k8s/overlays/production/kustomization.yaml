apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml

patches:
  - path: patch-browser-address.yaml
    target:
      kind: Deployment
      name: weather-analytics

images:
  - name: ghcr.io/jeysel-dev/weather-analytics
    newName: ghcr.io/jeysel-dev/weather-analytics
    # Promovido manualmente na Fase 6 (spec 072) — c9f7995 é a tag validada
    # e Synced em staging no momento da promoção (confirmado ao vivo via
    # kubectl antes deste commit, não presumido). Promoção deliberada, sem
    # bump automático de CI (production não tem esse passo, por design).
    newTag: c9f7995
