apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-analytics-staging
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: weather-analytics-staging.internal
      http:
        paths:
          # --- FastAPI (spec 090). Uma linha nova por página migrada. ---
          - path: /horario
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /static/api
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /temperatura
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /precipitacao
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /alertas
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /cidades
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /comparativo
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          - path: /relatorio-cidade
            pathType: Prefix
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          # --- Home nova (FastAPI): só o path exato "/" (spec 090). Antes do
          #     catch-all: "/" exato -> FastAPI; qualquer outro path que não
          #     bata numa regra FastAPI acima cai no catch-all Streamlit. ---
          - path: /
            pathType: Exact
            backend:
              service:
                name: weather-analytics-api
                port:
                  number: 8000
          # --- Streamlit (catch-all: tudo que não é "/" exato nem rota FastAPI,
          #     inclui as páginas antigas em maiúscula /Temperatura etc.) ---
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weather-analytics
                port:
                  number: 8501
